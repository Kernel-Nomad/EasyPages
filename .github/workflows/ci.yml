# The repository's merge gate. Before this existed the tests only ran when a release was
# published, so main could sit broken for weeks. One job, one check: what `make lint` and
# `make test` do locally, plus the one thing a development machine may lack — a Docker
# build and a cold-start smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never on a push. This repo commits straight to main, so that run is the only one a
  # commit ever gets: cancelling it because a second commit arrived would leave the first
  # unvalidated. Superseded PR runs are still fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  CHECK_JSONSCHEMA_VERSION: "0.38.0"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # A hung Docker build would otherwise burn the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The one file whose breakage is silent: an invalid dependabot.yml disables
      # Dependabot entirely, with no error anywhere.
      - name: Validate workflows and Dependabot config
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color .github/workflows/*.yml
          rm -f ./actionlint
          python -m pip install --quiet "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json \
            .github/dependabot.yml

      # No `version:` — pnpm/action-setup reads the one pinned by `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Before the tests: the integration suite boots the real app and asserts that the SPA
      # shell and its assets are served, which needs dist/ to exist.
      - name: Build frontend
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: easypages:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (cold start + setup wizard)
        run: bash .github/scripts/smoke-test.sh
