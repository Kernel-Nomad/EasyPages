# The repository's merge gate. Before this existed the tests only ran when a release was
# published, so main could sit broken for weeks. One job, one check: what `make lint` and
# `make test` do locally, plus the one thing a development machine may lack — a Docker
# build and a cold-start smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never on a push. This repo commits straight to main, so that run is the only one a
  # commit ever gets: cancelling it because a second commit arrived would leave the first
  # unvalidated. Superseded PR runs are still fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # A hung Docker build would otherwise burn the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The one file whose breakage is silent: an invalid dependabot.yml disables
      # Dependabot entirely, with no error anywhere.
      - name: Validate workflows and Dependabot config
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml
          rm -f ./actionlint
          python -m pip install --quiet check-jsonschema
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json \
            .github/dependabot.yml

      # No `version:` — pnpm/action-setup reads the one pinned by `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Before the tests: the integration suite boots the real app and asserts that the SPA
      # shell and its assets are served, which needs dist/ to exist.
      - name: Build frontend
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: easypages:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (cold start + setup wizard)
        run: |
          set -euo pipefail

          # One variable, no credentials and no account id: exactly the cold start a new
          # user gets. The token is fake, so any call that actually reaches Cloudflare
          # fails — which is fine, nothing below depends on Cloudflare answering.
          docker run -d --name easypages-ci -p 8002:8002 \
            -e CF_API_TOKEN=ci-fake-token \
            easypages:ci

          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/health.json http://127.0.0.1:8002/api/health; then
              break
            fi
            sleep 2
          done
          if ! [ -s /tmp/health.json ]; then
            echo "::error::Container did not respond within 60s"
            docker logs easypages-ci
            exit 1
          fi

          expect_code() {
            actual=$(curl -s -o /dev/null -w "%{http_code}" "${@:3}")
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 expected $2, got $actual"
              docker logs easypages-ci
              exit 1
            fi
          }

          # 1. Bootstrap: public, always 200, and it plants the session cookie plus the
          #    CSRF token the wizard needs. Without that this whole flow 403s.
          curl -fsS -c /tmp/jar.txt -o /tmp/status.json http://127.0.0.1:8002/api/auth/status
          echo "auth status: $(cat /tmp/status.json)"
          grep -q '"setup_complete":false' /tmp/status.json
          csrf=$(sed -n 's/.*"csrf_token":"\([^"]*\)".*/\1/p' /tmp/status.json)
          [ -n "$csrf" ] || { echo "::error::/api/auth/status returned no csrf_token"; exit 1; }

          # 2. The API stays closed until the wizard is done, and says why.
          curl -s -o /tmp/closed.json http://127.0.0.1:8002/api/projects
          grep -q '"code":"setup_required"' /tmp/closed.json \
            || { echo "::error::expected setup_required, got $(cat /tmp/closed.json)"; exit 1; }
          expect_code "/api/projects before setup" 401 http://127.0.0.1:8002/api/projects

          # 3. The bundle, unlike the API, is public: login is drawn by the SPA, so an
          #    anonymous visitor must be able to load it.
          expect_code "SPA shell" 200 http://127.0.0.1:8002/

          # 4. The wizard.
          expect_code "setup" 201 -X POST \
            -H 'Content-Type: application/json' \
            -H "CSRF-Token: $csrf" \
            -d '{"username":"ciadmin","password":"ci-only-password"}' \
            -b /tmp/jar.txt -c /tmp/jar.txt http://127.0.0.1:8002/api/auth/setup

          # 5. Replaying it is 409 for good: the claim window closes.
          curl -fsS -b /tmp/jar.txt -c /tmp/jar.txt -o /tmp/status2.json \
            http://127.0.0.1:8002/api/auth/status
          csrf2=$(sed -n 's/.*"csrf_token":"\([^"]*\)".*/\1/p' /tmp/status2.json)
          expect_code "setup replay" 409 -X POST \
            -H 'Content-Type: application/json' \
            -H "CSRF-Token: $csrf2" \
            -d '{"username":"intruso","password":"otra-contrasena"}' \
            -b /tmp/jar.txt http://127.0.0.1:8002/api/auth/setup

          # 6. The session now passes the auth wall. Asserted on the error code rather
          #    than the status: behind the wall the request reaches Cloudflare, which
          #    rejects the fake token with a status of its own choosing.
          curl -s -b /tmp/jar.txt -o /tmp/projects.json http://127.0.0.1:8002/api/projects
          if grep -qE '"code":"(setup_required|session_expired)"' /tmp/projects.json; then
            echo "::error::session did not pass the auth wall: $(cat /tmp/projects.json)"
            exit 1
          fi

          # 7. The SPA fallback must not swallow API 404s, and must not answer a stale
          #    hashed asset with the shell — that shows up as a blank page.
          #    The CSRF token is required: it is checked before routing, so without it this
          #    would be a 403 and would never reach the question being asked.
          curl -s -o /tmp/notfound.json -X DELETE \
            -H "CSRF-Token: $csrf2" -b /tmp/jar.txt http://127.0.0.1:8002/api/no-existe
          grep -q '"code":"not_found"' /tmp/notfound.json \
            || { echo "::error::unknown API route returned $(cat /tmp/notfound.json)"; exit 1; }
          expect_code "unknown API route" 404 -X DELETE \
            -H "CSRF-Token: $csrf2" -b /tmp/jar.txt http://127.0.0.1:8002/api/no-existe
          expect_code "missing asset" 404 http://127.0.0.1:8002/assets/index-deadbeef.js
          # ...but a navigation route does have to get the shell.
          expect_code "navigation route" 200 http://127.0.0.1:8002/projects

          # 8. The legacy /login redirect keeps an old curl'd docker-compose.yml healthy:
          #    its probe follows redirects and must still land on a 200.
          expect_code "legacy /login (followed)" 200 -L http://127.0.0.1:8002/login

          # 9. The credential file must not be group- or world-readable.
          mode=$(docker exec easypages-ci stat -c '%a' /data/credentials.json)
          [ "$mode" = "600" ] || { echo "::error::credentials.json is $mode, expected 600"; exit 1; }

          # 10. The image's own healthcheck has to agree.
          for _ in $(seq 1 20); do
            health=$(docker inspect -f '{{.State.Health.Status}}' easypages-ci)
            [ "$health" = "starting" ] || break
            sleep 3
          done
          [ "$health" = "healthy" ] || { echo "::error::container health is $health"; exit 1; }

          echo "Cold start, setup wizard, session, SPA fallback and healthcheck all OK"

      - name: Cleanup
        if: always()
        run: docker rm -f easypages-ci || true
