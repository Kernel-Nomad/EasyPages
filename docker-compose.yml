services:
  easypages:
    container_name: easypages
    image: ghcr.io/kn990x/easypages:2.1.3
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      EASYPAGES_DATA_DIR: /data
      # Interpolated from the project .env (not env_file). Direct HTTP defaults keep
      # Secure off and do not trust X-Forwarded-For. Behind TLS+proxy set both in .env:
      # SESSION_COOKIE_SECURE=true and TRUST_PROXY=1.
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    env_file:
      - .env
    volumes:
      - ./easypages-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8002)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
