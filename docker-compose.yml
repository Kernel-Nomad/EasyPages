services:
  easypages:
    container_name: easypages
    image: ghcr.io/kn990x/easypages:1.1.2
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      EASYPAGES_DATA_DIR: /data
      # Direct HTTP on the published port: Compose wins over .env. Behind TLS+proxy set
      # both SESSION_COOKIE_SECURE=true and TRUST_PROXY to the hop count (default 1).
      SESSION_COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
    env_file:
      - .env
    volumes:
      - ./easypages-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
